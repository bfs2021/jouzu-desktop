name: Dependency audit

# Advisories are checked when the dependencies change, every day against the
# latest advisory database, and by the release before an installer is built.
# A finding is fixed by upgrading, not by ignoring it.
on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '0 21 * * *'
  pull_request:
    paths:
      - 'apps/launcher/package-lock.json'
      - 'apps/launcher/host/Cargo.lock'
      - 'apps/launcher/src-tauri/Cargo.lock'
      - '.github/workflows/dependency-audit.yml'
permissions:
  contents: read
concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.2'
      - name: npm audit
        run: npm audit --prefix apps/launcher --audit-level=high
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v1
      - name: RustSec audit
        run: |
          command -v cargo-audit >/dev/null || cargo install cargo-audit --locked
          # The repository root has no Cargo.lock: each native crate keeps its own.
          for lock in apps/launcher/host/Cargo.lock apps/launcher/src-tauri/Cargo.lock; do
            cargo audit --file "$lock"
          done
